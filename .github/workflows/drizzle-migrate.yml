name: Drizzle Migrations

on:
    push:
        branches:
            - master
            - dev
    workflow_dispatch:

jobs:
    migrate:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - run: npm run db:migrate
              env:
                  NUXT_DATABASE_URL: ${{ secrets.NUXT_DATABASE_URL }}
